name: Benchmark Graphite

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'main'
      options:
        description: 'Options'
        required: false

jobs:
  benchmark:
    name: Run Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements and graphite
        run: |
          python -m pip install --upgrade pip
          pip install ".[benchmark]"

      - name: Run benchmark
        run: |
          python benchmark.py ${{ github.event.inputs.options }} 2>&1 | tee ../benchmark_output.txt
        working-directory: tests
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-run${{ github.run_id }}
          path: benchmark_output.txt
          retention-days: 30
